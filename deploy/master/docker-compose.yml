services:
  iris-web:
    build:
      context: ../..
      dockerfile: docker/dockerfile
      target: release
    container_name: iris-web
    restart: unless-stopped
    environment:
      IRIS_MODE: master
      # Database configuration
      UPTIME_KUMA_DB_TYPE: mariadb
      UPTIME_KUMA_DB_HOSTNAME: iris-db
      UPTIME_KUMA_DB_PORT: 3306
      UPTIME_KUMA_DB_NAME: iris
      UPTIME_KUMA_DB_USERNAME: iris
      UPTIME_KUMA_DB_PASSWORD: ${DB_PASSWORD}
      # Auto-create admin user (skips /setup wizard)
      UPTIME_KUMA_ADMIN_USERNAME: ${IRIS_MASTER_USER:-admin}
      UPTIME_KUMA_ADMIN_PASSWORD: ${IRIS_MASTER_PASSWORD}
      UPTIME_KUMA_ADMIN_LANGUAGE: en
      # Optional integrations (set via GitHub secrets)
      GRAFANA_API_KEY: ${GRAFANA_API_KEY:-}
    ports:
      - "3001:3001"
    volumes:
      - iris-web-data:/app/data
    depends_on:
      iris-db:
        condition: service_healthy
    networks:
      - iris-network

  iris-db:
    image: mariadb:10.11
    container_name: iris-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: iris
      MARIADB_USER: iris
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - iris-db-data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - iris-network

  iris-otel:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: iris-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      # Credentials to scrape /metrics from iris-web (same as admin user)
      IRIS_METRICS_USER: ${IRIS_MASTER_USER:-admin}
      IRIS_METRICS_PASSWORD: ${IRIS_MASTER_PASSWORD}
      # Grafana Cloud OTLP auth header (format: "Basic <base64(instanceId:apiKey)>")
      GRAFANA_OTLP_HEADERS: ${GRAFANA_OTLP_HEADERS:-}
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics (collector self-metrics)
    depends_on:
      - iris-web
    networks:
      - iris-network

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt

volumes:
  iris-web-data:
  iris-db-data:

networks:
  iris-network:
    driver: bridge
