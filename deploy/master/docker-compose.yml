services:
  iris-web:
    build:
      context: ../..
      dockerfile: docker/dockerfile
      target: release
    container_name: iris-web
    restart: unless-stopped
    environment:
      IRIS_MODE: master
      # Database configuration
      UPTIME_KUMA_DB_TYPE: mariadb
      UPTIME_KUMA_DB_HOSTNAME: iris-db
      UPTIME_KUMA_DB_PORT: 3306
      UPTIME_KUMA_DB_NAME: iris
      UPTIME_KUMA_DB_USERNAME: iris
      UPTIME_KUMA_DB_PASSWORD: ${DB_PASSWORD}
      # Auto-create admin user (skips /setup wizard)
      UPTIME_KUMA_ADMIN_USERNAME: ${IRIS_MASTER_USER:-admin}
      UPTIME_KUMA_ADMIN_PASSWORD: ${IRIS_MASTER_PASSWORD}
      UPTIME_KUMA_ADMIN_LANGUAGE: en
      # Optional integrations (set via GitHub secrets)
      GRAFANA_API_KEY: ${GRAFANA_API_KEY:-}
    ports:
      - "3001:3001"
    volumes:
      - iris-web-data:/app/data
    depends_on:
      iris-db:
        condition: service_healthy
    networks:
      - iris-network

  iris-db:
    image: mariadb:10.11
    container_name: iris-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: iris
      MARIADB_USER: iris
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - iris-db-data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    ports:
      # Expose to localhost only for iris-sync (host network mode)
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - iris-network

  iris-otel:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: iris-otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      # Credentials to scrape /metrics from iris-web (same as admin user)
      IRIS_METRICS_USER: ${IRIS_MASTER_USER:-admin}
      IRIS_METRICS_PASSWORD: ${IRIS_MASTER_PASSWORD}
      # Grafana Cloud OTLP auth header (format: "Basic <base64(instanceId:apiKey)>")
      GRAFANA_OTLP_HEADERS: ${GRAFANA_OTLP_HEADERS:-}
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics (collector self-metrics)
      - "8889:8889"   # Prometheus exporter (probe metrics for iris-public)
    depends_on:
      - iris-web
    networks:
      - iris-network

  iris-sync:
    build:
      context: ../../iris-sync
      dockerfile: Dockerfile
    container_name: iris-sync
    restart: unless-stopped
    # Host network mode to access Tailscale mesh for probe connectivity
    network_mode: host
    environment:
      # Master DB connection (via localhost since we're on host network)
      IRIS_SYNC_DB_HOST: 127.0.0.1
      IRIS_SYNC_DB_PORT: 3306
      IRIS_SYNC_DB_NAME: iris
      IRIS_SYNC_DB_USER: iris
      IRIS_SYNC_DB_PASSWORD: ${DB_PASSWORD}
      # Probe configuration (via Tailscale IPs - MagicDNS not available in container)
      # YAML format embedded in env var
      IRIS_SYNC_PROBES: |
        - name: probe01
          endpoint: http://100.97.5.70:3001
          username: ${IRIS_PROBE_USER:-admin}
          password: ${IRIS_PROBE_PASSWORD}
        - name: labbmartin
          endpoint: http://100.88.142.75:3001
          username: ${IRIS_PROBE_USER:-admin}
          password: ${IRIS_PROBE_PASSWORD}
        # Retired – debian/debianbook removed from deployment
        # - name: debian
        #   endpoint: http://100.87.62.9:3001
        #   username: ${IRIS_PROBE_USER:-admin}
        #   password: ${IRIS_PROBE_PASSWORD}
      # Sync settings
      IRIS_SYNC_INTERVAL: 5m
      IRIS_SYNC_DELETE_ORPHANS: "true"
      IRIS_SYNC_DRY_RUN: "false"
      IRIS_SYNC_LOG_LEVEL: info
      # Increased timeout for login - afterLogin() can take >30s with many monitors
      IRIS_SYNC_OPERATION_TIMEOUT: 120s
    volumes:
      - iris-sync-data:/app/data
    depends_on:
      iris-db:
        condition: service_healthy

  # Consolidated frontend: public status (/) + catalog docs (/docs)
  # Replaces the old iris-catalog + iris-public proxy pair.
  # Deploy: docker compose up -d --remove-orphans --build iris-public
  # This stops old iris-catalog container automatically.
  iris-public:
    build:
      context: ../../iris-public
      dockerfile: Dockerfile
    container_name: iris-public
    restart: unless-stopped
    environment:
      # Nuxt 3 runtimeConfig requires NUXT_ prefix for runtime override
      NUXT_KUMA_URL: http://iris-web:3001
      NUXT_KUMA_USERNAME: ${IRIS_MASTER_USER:-admin}
      NUXT_KUMA_PASSWORD: ${IRIS_MASTER_PASSWORD}
      NUXT_OTEL_PROM_URL: http://iris-otel:8889/metrics
      NUXT_AUTH_USERNAME: ${CATALOG_USER:-admin}
      NUXT_AUTH_PASSWORD: ${CATALOG_PASSWORD:-}
      FARO_COLLECTOR_URL: ${FARO_COLLECTOR_URL:-}
    ports:
      - "3002:3000"
    depends_on:
      - iris-web
      - iris-otel
    networks:
      - iris-network

  iris-caddy:
    image: caddy:2-alpine
    container_name: iris-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - iris-caddy-data:/data
      - iris-caddy-config:/config
    depends_on:
      - iris-public
    networks:
      - iris-network

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt

volumes:
  iris-web-data:
  iris-db-data:
  iris-sync-data:
  iris-caddy-data:
  iris-caddy-config:

networks:
  iris-network:
    driver: bridge
