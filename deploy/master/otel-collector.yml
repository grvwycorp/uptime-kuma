receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape Prometheus metrics from iris-web
  prometheus:
    config:
      scrape_configs:
        - job_name: 'iris-web'
          scrape_interval: 30s
          metrics_path: /metrics
          basic_auth:
            username: '${env:IRIS_METRICS_USER}'
            password: '${env:IRIS_METRICS_PASSWORD}'
          static_configs:
            - targets: ['iris-web:3001']

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Debug logging (useful for troubleshooting)
  debug:
    verbosity: basic

  # Grafana Cloud OTLP exporter
  otlphttp/grafana:
    endpoint: https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
    headers:
      Authorization: '${env:GRAFANA_OTLP_HEADERS}'

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [debug, otlphttp/grafana]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
