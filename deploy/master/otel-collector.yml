receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Legacy Prometheus scraper removed - was creating duplicate metrics
  # with job="unknown_service:node" and high-cardinality labels.
  # All metrics now flow through OTLP push from probes (job="iris-probe").

  # Collect Docker container logs from all containers on this host.
  # Parses the Docker JSON log format and extracts body/stream/timestamp.
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*.log
    include_file_path: true
    include_file_name: false
    start_at: end
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%fZ'
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 248

  # Tag filelog-sourced logs with the host so they're distinguishable in Grafana
  resource/master:
    attributes:
      - action: upsert
        key: host.name
        value: master01

exporters:
  # Debug logging (useful for troubleshooting)
  debug:
    verbosity: basic

  # Grafana Cloud OTLP exporter
  otlp_http/grafana:
    endpoint: https://otlp-gateway-prod-us-central-0.grafana.net/otlp
    headers:
      Authorization: 'Basic ${env:GRAFANA_OTLP_HEADERS}'

  # Local Prometheus exporter for iris-public
  prometheus:
    endpoint: "0.0.0.0:8889"
    metric_expiration: 15m

  # VictoriaMetrics long-term storage
  prometheusremotewrite/vm:
    endpoint: "http://iris-vm:8428/api/v1/write"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_http/grafana, prometheus, prometheusremotewrite/vm]

    logs:
      receivers: [otlp, filelog/docker]
      processors: [memory_limiter, resource/master, batch]
      exporters: [debug, otlp_http/grafana]

  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
