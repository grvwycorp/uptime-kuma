receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Scrape a very small subset of the collector's own Prometheus telemetry so
  # Grafana Cloud can evaluate OTEL queue/export alerts and SLOs.
  prometheus/self:
    config:
      global:
        scrape_interval: 30s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: otelcol-contrib
          static_configs:
            - targets: ["127.0.0.1:8888"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'up|otelcol_(exporter_queue_size|exporter_queue_capacity|exporter_send_failed_metric_points_total|exporter_sent_metric_points_total|receiver_accepted_metric_points_total|receiver_failed_metric_points_total|receiver_refused_metric_points_total|process_memory_rss)'
              action: keep
            - source_labels: [exporter]
              regex: 'otlp_http/grafana'
              target_label: exporter
              replacement: otlphttp
              action: replace

  # Legacy Prometheus scraper removed - was creating duplicate metrics
  # with job="unknown_service:node" and high-cardinality labels.
  # All metrics now flow through OTLP push from probes (job="iris-probe").

  # Collect Docker container logs from all containers on this host.
  # Parses the Docker JSON log format and extracts body/stream/timestamp.
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*.log
    include_file_path: true
    include_file_name: false
    start_at: end
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%fZ'
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]

processors:
  # Grafana Cloud is the constrained backend, so give it a slimmer metrics
  # branch while keeping the full metrics stream for local Prometheus + VM.
  filter/grafana_cloud_metrics:
    error_mode: ignore
    metrics:
      metric:
        - metric.name == "monitor_cert_days_remaining"
        - metric.name == "monitor_cert_is_valid"

  # The main Iris dashboard only joins monitor_info on service/name/type/IDs.
  # Trim unused metadata labels on the Grafana Cloud branch to reduce churn.
  transform/grafana_cloud_metrics:
    error_mode: ignore
    metric_statements:
      - delete_key(datapoint.attributes, "monitor_url") where metric.name == "monitor_info"
      - delete_key(datapoint.attributes, "monitor_hostname") where metric.name == "monitor_info"
      - delete_key(datapoint.attributes, "monitor_port") where metric.name == "monitor_info"
      - delete_key(datapoint.attributes, "tags") where metric.name == "monitor_info"
      - delete_key(datapoint.attributes, "sub_service") where metric.name == "monitor_info"
      - delete_key(datapoint.attributes, "target_ip") where metric.name == "target_geo_info"

  batch/default:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 1024

  # Keep log batches smaller than metrics/traces to reduce burst memory
  # pressure when filelog/docker drains multiple container logs at once.
  batch/logs:
    timeout: 5s
    send_batch_size: 256

  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
    spike_limit_mib: 248

  # Tag filelog-sourced logs with the host so they're distinguishable in Grafana
  resource/master:
    attributes:
      # Only stamp host.name for local filelog records. Probe OTLP logs already
      # carry their own host.name and must not be rewritten to master01.
      - action: insert
        key: host.name
        value: master01

exporters:
  # Keep debug available for ad-hoc troubleshooting, but do not wire it into
  # prod metrics/logs pipelines. This collector tails Docker logs locally, so
  # exporting live data back to its own stderr can create a noisy feedback loop.
  debug:
    verbosity: basic

  # Grafana Cloud OTLP exporter
  otlp_http/grafana:
    endpoint: https://otlp-gateway-prod-us-central-0.grafana.net/otlp
    headers:
      Authorization: 'Basic ${env:GRAFANA_OTLP_HEADERS}'

  # Local Prometheus exporter for iris-public
  prometheus:
    endpoint: "0.0.0.0:8889"
    metric_expiration: 15m

  # VictoriaMetrics long-term storage
  prometheusremotewrite/vm:
    endpoint: "http://iris-vm:8428/api/v1/write"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch/default]
      exporters: [debug]

    # Full-fidelity metrics stay local for iris-public and long-term storage.
    metrics/local:
      receivers: [otlp, prometheus/self]
      processors: [memory_limiter, batch/default]
      exporters: [prometheus, prometheusremotewrite/vm]

    # Grafana Cloud gets a filtered branch to stay under ingestion limits while
    # preserving the metrics and labels the current dashboard depends on.
    metrics/grafana:
      receivers: [otlp, prometheus/self]
      processors: [memory_limiter, filter/grafana_cloud_metrics, transform/grafana_cloud_metrics, batch/default]
      exporters: [otlp_http/grafana]

    logs:
      receivers: [otlp, filelog/docker]
      processors: [memory_limiter, resource/master, batch/logs]
      exporters: [otlp_http/grafana]

  telemetry:
    resource:
      host.name: master01
      iris.collector.role: master
    logs:
      level: warn
    metrics:
      # Detailed includes richer HTTP/RPC and batch metrics. The sent/failed/
      # accepted/refused counters are basic-level, but we keep the collector at
      # detailed so Grafana has the full self-observability surface we need for
      # alerts and future SLO work.
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
                with_resource_constant_labels:
                  included:
                    - host.name
                    - iris.collector.role
