receivers:
  # Collect Docker container logs from all containers on this probe host.
  # Parses Docker JSON log format; ships to master's OTEL collector via OTLP.
  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*.log
    include_file_path: true
    include_file_name: false
    start_at: end
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%fZ'
      - type: move
        from: attributes.log
        to: body
      - type: move
        from: attributes.stream
        to: attributes["log.iostream"]

processors:
  batch:
    timeout: 10s
    send_batch_size: 512

  # Tag logs with probe hostname so they're distinguishable in Grafana
  resource/probe:
    attributes:
      - action: upsert
        key: host.name
        value: ${env:HOSTNAME}
      - action: upsert
        key: service.name
        value: iris-probe

exporters:
  # Forward logs to master's OTEL collector via OTLP HTTP (same endpoint probes use for metrics)
  otlp_http/master:
    endpoint: http://${env:IRIS_MASTER_IP}:4318
    tls:
      insecure: true

service:
  telemetry:
    resource:
      host.name: ${env:HOSTNAME}
      iris.collector.role: probe
    logs:
      level: warn
    metrics:
      # Emit the probe log collector's own otelcol_* metrics upstream so we can
      # alert on sent/failed/refused behavior without SSHing into the host.
      level: detailed
      readers:
        - periodic:
            interval: 30s
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://${env:IRIS_MASTER_IP}:4318

  pipelines:
    logs:
      receivers: [filelog/docker]
      processors: [resource/probe, batch]
      exporters: [otlp_http/master]
