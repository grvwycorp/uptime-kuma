services:
  iris-probe:
    # Pre-built in CI (.github/workflows/deploy.yml → build-probe-image) and
    # PULLED from GHCR so probe hosts never run the heavy npm-ci + Vite build.
    # This drops the probe RAM floor from ~4GB (on-host build) to ~1.5–2GB
    # (runtime only), which unlocks cheaper VPS targets. The deploy workflow
    # pins IRIS_IMAGE_TAG to the deployed commit; a manual `up` falls back to
    # :latest. The `build:` block below is retained ONLY for local dev
    # (`docker compose build`) — the probe deploy always pulls, never builds.
    image: ghcr.io/grvwycorp/iris-probe:${IRIS_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: docker/dockerfile
      target: release
    container_name: iris-probe
    hostname: ${HOSTNAME:-iris-probe}
    restart: unless-stopped
    environment:
      # Auto-configure embedded MariaDB (skips /setup-database wizard)
      UPTIME_KUMA_ENABLE_EMBEDDED_MARIADB: "1"
      UPTIME_KUMA_DB_TYPE: embedded-mariadb
      # Auto-create admin user (skips /setup wizard)
      UPTIME_KUMA_ADMIN_USERNAME: ${IRIS_PROBE_USER:-admin}
      UPTIME_KUMA_ADMIN_PASSWORD: ${IRIS_PROBE_PASSWORD}
      UPTIME_KUMA_ADMIN_LANGUAGE: en
      # Iris probe configuration
      IRIS_MODE: probe
      IRIS_PROBE_ID: ${HOSTNAME:-iris-probe}
      # IP geolocation (auto-discover probe location + resolve target geo)
      GEO_PROVIDER: ip-api
      # OTEL endpoint on master (via Tailscale IP) - using HTTP port 4318
      # Note: MagicDNS names don't resolve inside Docker bridge containers,
      # so we use the Tailscale IP directly via IRIS_MASTER_IP org secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${IRIS_MASTER_IP}:4318
      # Slow probe metric exports to 30s to reduce Grafana Cloud ingestion
      # pressure now that the fleet has grown to three probes.
      OTEL_METRIC_EXPORT_INTERVAL: 30000
    volumes:
      - iris-probe-data:/app/data
    # Host network mode: avoids creating a new network namespace, which fixes
    # "sysctl ip_unprivileged_port_start: permission denied" on unprivileged LXC containers.
    # Also makes the probe directly reachable via Tailscale IP.
    network_mode: host

  # BGP deployment is intentionally disabled for now.
  # The metrics are not currently needed enough to justify their Grafana Cloud
  # active-series cost, and the deploy workflow removes any old BGP containers.

volumes:
  iris-probe-data:
