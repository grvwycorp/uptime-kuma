services:
  iris-probe:
    build:
      context: ../..
      dockerfile: docker/dockerfile
      target: release
    container_name: iris-probe
    hostname: ${HOSTNAME:-iris-probe}
    restart: unless-stopped
    environment:
      # Auto-configure embedded MariaDB (skips /setup-database wizard)
      UPTIME_KUMA_ENABLE_EMBEDDED_MARIADB: "1"
      UPTIME_KUMA_DB_TYPE: embedded-mariadb
      # Auto-create admin user (skips /setup wizard)
      UPTIME_KUMA_ADMIN_USERNAME: ${IRIS_PROBE_USER:-admin}
      UPTIME_KUMA_ADMIN_PASSWORD: ${IRIS_PROBE_PASSWORD}
      UPTIME_KUMA_ADMIN_LANGUAGE: en
      # Iris probe configuration
      IRIS_MODE: probe
      IRIS_PROBE_ID: ${HOSTNAME:-iris-probe}
      # IP geolocation (auto-discover probe location + resolve target geo)
      GEO_PROVIDER: ip-api
      # OTEL endpoint on master (via Tailscale IP) - using HTTP port 4318
      # Note: MagicDNS names don't resolve inside Docker bridge containers,
      # so we use the Tailscale IP directly via IRIS_MASTER_IP org secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${IRIS_MASTER_IP}:4318
    volumes:
      - iris-probe-data:/app/data
    # Host network mode: avoids creating a new network namespace, which fixes
    # "sysctl ip_unprivileged_port_start: permission denied" on unprivileged LXC containers.
    # Also makes the probe directly reachable via Tailscale IP.
    network_mode: host

  # ==========================================================================
  # BGP monitoring (profile: bgp) — only activated on probes with enough RAM
  # Activate via: COMPOSE_PROFILES=bgp docker compose up -d
  # Currently: labbmartin only (6GB RAM)
  # ==========================================================================

  # BGPalerter — watches Swedish ASNs/prefixes via RIPE RIS Live WebSocket
  # Requires ~4GB total system RAM (hardcoded check in upstream image)
  iris-bgp:
    profiles: ["bgp"]
    image: nttgin/bgpalerter:latest
    container_name: iris-bgp
    restart: unless-stopped
    volumes:
      - ../../iris-bgp/config/bgpalerter.yml:/opt/bgpalerter/config.yml:ro
      - ../../iris-bgp/config/prefixes.yml:/opt/bgpalerter/prefixes.yml:ro
      - iris-bgp-data:/opt/bgpalerter/volume
    ports:
      # Pull API + health check (localhost only)
      - "127.0.0.1:8011:8011"
    networks:
      - bgp-network

  # Converts BGPalerter webhook alerts into OTEL metrics, pushes to master collector
  iris-bgp-bridge:
    profiles: ["bgp"]
    build:
      context: ../../iris-bgp/bridge
      dockerfile: Dockerfile
    container_name: iris-bgp-bridge
    restart: unless-stopped
    environment:
      # Push OTLP gRPC to master's collector via Tailscale IP
      OTEL_EXPORTER_OTLP_ENDPOINT: http://${IRIS_MASTER_IP}:4317
      BGP_ALERTER_STATUS_URL: http://iris-bgp:8011/status
    depends_on:
      - iris-bgp
    networks:
      - bgp-network

volumes:
  iris-probe-data:
  iris-bgp-data:

networks:
  bgp-network:
    driver: bridge
