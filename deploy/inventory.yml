# To add a new probe:
# 1. Run setup-runner.sh with labels: probe
#    The script appends the hostname as a unique runner label automatically.
# 2. Run setup-tailscale.sh with appropriate hostname
# 3. Add the hostname label to the probe matrix in .github/workflows/deploy.yml
# 4. Push to master branch - probe auto-deploys
