# Iris Fleet Inventory
# This file documents the fleet topology for reference.
# Actual deployment is driven by GitHub runner labels.

masters:
  - hostname: master01-hostup
    description: Primary master node (HostUp VPS)
    runner_labels: [self-hosted, master]
    tailscale_name: master01-hostup
    tailscale_ip: 100.121.116.41
    tailscale_fqdn: master01-hostup.tail605657.ts.net
    location: frankfurt
    services:
      - iris-web (UI only, no monitoring)
      - iris-db (MariaDB)
      - iris-otel (OpenTelemetry collector)
      - iris-sync (Monitor synchronization to probes)

  # Future HA:
  # - hostname: master02
  #   description: Secondary master node
  #   runner_labels: [self-hosted, master]
  #   tailscale_name: master02
  #   location: nuremberg

probes:
  - hostname: probe01
    description: VPS probe
    runner_labels: [self-hosted, probe]
    tailscale_name: probe01
    tailscale_ip: 100.97.5.70
    tailscale_fqdn: probe01.tail605657.ts.net
    location: frankfurt

  # Retired – removed from CI/CD deployment
