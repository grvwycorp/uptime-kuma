# Iris Fleet Inventory
# This file documents the fleet topology for reference.
# Actual deployment is driven by the hardcoded probe matrix in
# .github/workflows/deploy.yml plus GitHub runner labels.

masters:
  - hostname: master01-hostup
    description: Primary master node (HostUp VPS)
    runner_labels: [self-hosted, master]
    tailscale_name: master01-hostup
    tailscale_ip: 100.121.116.41
    tailscale_fqdn: master01-hostup.tail605657.ts.net
    location: frankfurt
    services:
      - iris-web (UI only, no monitoring)
      - iris-db (MariaDB)
      - iris-otel (OpenTelemetry collector)
      - iris-sync (Monitor synchronization to probes)

  # Future HA:
  # - hostname: master02
  #   description: Secondary master node
  #   runner_labels: [self-hosted, master]
  #   tailscale_name: master02
  #   location: nuremberg

probes:
  - hostname: probe01
    description: VPS probe
    runner_labels: [self-hosted, probe, probe01]
    tailscale_name: probe01
    tailscale_ip: 100.97.5.70
    tailscale_fqdn: probe01.tail605657.ts.net
    location: Stockholm

  - hostname: labbmartin
    description: Lab probe (Martin)
    runner_labels: [self-hosted, probe, labbmartin]
    tailscale_name: labbmartin
    tailscale_ip: 100.88.142.75
    tailscale_fqdn: labbmartin.tail605657.ts.net
    location: Karlstad

  - hostname: probe03-karabro
    description: probe03 VPS 
    runner_labels: [self-hosted, Linux, X64, probe, probe03-karabro]
    tailscale_name: probe03-karabro
    tailscale_ip: 100.74.20.32
    location: Malmö
  # Retired – removed from CI/CD deployment
  # - hostname: debian
  #   description: Debianbook probe
  #   runner_labels: [self-hosted, probe]
  #   tailscale_name: debian
  #   tailscale_ip: 100.87.62.9
  #   tailscale_fqdn: debian.tail605657.ts.net
  #   location: nuremberg

# To add a new probe:
# 1. Run setup-runner.sh with labels: probe
#    The script appends the hostname as a unique runner label automatically.
# 2. Run setup-tailscale.sh with appropriate hostname
# 3. Add the hostname label to the probe matrix in .github/workflows/deploy.yml
# 4. Push to master branch - probe auto-deploys
