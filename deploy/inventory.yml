# Iris Fleet Inventory
# This file documents the fleet topology for reference (INTENT).
# Actual deployment is driven by the hardcoded probe matrix in
# .github/workflows/deploy.yml plus GitHub runner labels.
#
# For LIVE REALITY (which nodes are actually online + serving), do not trust this
# file — run the facts-first CMDB: `node iris-cmdb/bin/iris-cmdb.js`. Snapshot at
# orchestrator/infra/fleet-snapshot.md.
#
# Last reconciled against live facts: 2026-06-17 (iris-cmdb). Findings folded in
# below as `verified:` / `status:` annotations.

masters:
  - hostname: master01-hostup
    description: Primary master node (HostUp VPS)
    runner_labels: [self-hosted, master]
    # CORRECTED 2026-06-17: the Tailscale device name is `master01`, not
    # `master01-hostup` (verified via `tailscale status`).
    tailscale_name: master01
    tailscale_ip: 100.121.116.41
    tailscale_fqdn: master01.tail605657.ts.net
    location: frankfurt
    verified: 2026-06-17 online, serving Iris :3001 (HTTP 302)
    services:
      - iris-web (UI only, no monitoring)
      - iris-db (MariaDB)
      - iris-otel (OpenTelemetry collector)
      - iris-sync (Monitor synchronization to probes)

