name: Deploy Iris

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/auto-test.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - master
          - probes
      rebuild:
        description: 'Force rebuild (no cache)'
        required: false
        default: false
        type: boolean

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # Master deployment
  # Runs on nodes with label: [self-hosted, master]
  # ============================================
  deploy-master:
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'master'
    runs-on: [self-hosted, master]
    timeout-minutes: 25

    env:
      DEPLOY_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create secrets directory
        run: mkdir -p deploy/master/secrets

      - name: Write DB secrets to files
        run: |
          echo "${{ secrets.DB_ROOT_PASSWORD }}" > deploy/master/secrets/db_root_password.txt
          echo "${{ secrets.DB_PASSWORD }}" > deploy/master/secrets/db_password.txt
          chmod 600 deploy/master/secrets/*.txt

      - name: Build and deploy master services
        working-directory: deploy/master
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
          GRAFANA_OTLP_HEADERS: ${{ secrets.GRAFANA_OTLP_HEADERS }}
          IRIS_MASTER_USER: ${{ secrets.IRIS_MASTER_USER }}
          IRIS_MASTER_PASSWORD: ${{ secrets.IRIS_MASTER_PASSWORD }}
          # Probe credentials for iris-sync to authenticate with probes
          IRIS_PROBE_USER: ${{ secrets.IRIS_PROBE_USER }}
          IRIS_PROBE_PASSWORD: ${{ secrets.IRIS_PROBE_PASSWORD }}
          # Catalog auth credentials
          CATALOG_USER: ${{ secrets.CATALOG_USER }}
          CATALOG_PASSWORD: ${{ secrets.CATALOG_PASSWORD }}
          FARO_COLLECTOR_URL: ${{ secrets.FARO_COLLECTOR_URL }}
        run: |
          BUILD_ARGS=""
          if [ "${{ github.event.inputs.rebuild }}" == "true" ]; then
            BUILD_ARGS="--no-cache"
          fi
          docker compose -p iris build $BUILD_ARGS
          docker compose -p iris up -d --force-recreate --remove-orphans
          # Restart OTEL to pick up config changes (mounted volume doesn't trigger recreation)
          docker compose -p iris restart iris-otel || true
          sleep 5
          docker compose -p iris ps

      - name: Health check (iris-web)
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3001 > /dev/null; then
              echo "Iris web is healthy"
              exit 0
            fi
            echo "Waiting for Iris web... ($i/30)"
            sleep 2
          done
          echo "Health check failed"
          docker compose -p iris -f deploy/master/docker-compose.yml logs iris-web
          exit 1

      - name: Health check (iris-sync)
        run: |
          # Wait for iris-sync to start and perform initial sync
          sleep 15
          # Check if container is running
          if docker ps --format '{{.Names}}' | grep -q iris-sync; then
            echo "iris-sync container is running"
            # Show recent logs
            echo "=== iris-sync logs (last 30 lines) ==="
            docker logs iris-sync 2>&1 | tail -30
          else
            echo "Warning: iris-sync container not running"
            docker compose -p iris -f deploy/master/docker-compose.yml logs iris-sync
            # Don't fail deployment if sync isn't running (probes may not be up yet)
          fi

      - name: Health check (iris-public)
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3002/api/health > /dev/null; then
              echo "Iris public is healthy"
              exit 0
            fi
            echo "Waiting for Iris public... ($i/30)"
            sleep 2
          done
          echo "Warning: iris-public health check failed"
          docker compose -p iris -f deploy/master/docker-compose.yml logs iris-public 2>&1 | tail -30
          # Don't fail deployment if frontend isn't ready yet

      - name: Cleanup old images
        run: docker image prune -f

  # ============================================
  # Probe deployment
  # Uses matrix to deploy to ALL probe runners
  # Add unique labels to runners: probe01, etc.
  # ============================================
  deploy-probes:
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'probes'
    strategy:
      fail-fast: false
      matrix:
        probe:
          - probe01
          - labbmartin
          # - debianbook  # Retired – removed from deployment
    runs-on: [self-hosted, probe, '${{ matrix.probe }}']
    timeout-minutes: 15

    env:
      DEPLOY_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get probe identity
        id: identity
        run: |
          PROBE_HOSTNAME=$(hostname -s)
          echo "hostname=${PROBE_HOSTNAME}" >> $GITHUB_OUTPUT
          echo "Deploying probe: ${PROBE_HOSTNAME}"

      - name: Build and deploy probe
        working-directory: deploy/probe
        env:
          HOSTNAME: ${{ steps.identity.outputs.hostname }}
          IRIS_PROBE_USER: ${{ secrets.IRIS_PROBE_USER }}
          IRIS_PROBE_PASSWORD: ${{ secrets.IRIS_PROBE_PASSWORD }}
          IRIS_MASTER_IP: ${{ secrets.IRIS_MASTER_IP }}
        run: |
          BUILD_ARGS=""
          if [ "${{ github.event.inputs.rebuild }}" == "true" ]; then
            BUILD_ARGS="--no-cache"
          fi
          docker compose -p iris build $BUILD_ARGS
          docker compose -p iris up -d --force-recreate --remove-orphans
          sleep 5
          docker compose -p iris ps

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3001 > /dev/null; then
              echo "Iris probe is healthy"
              exit 0
            fi
            echo "Waiting for Iris probe... ($i/30)"
            sleep 2
          done
          echo "Health check failed"
          docker compose -p iris -f deploy/probe/docker-compose.yml logs iris-probe
          exit 1

      - name: Cleanup old images
        run: docker image prune -f
