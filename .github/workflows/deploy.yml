name: Deploy Iris

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/auto-test.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - master
          - probes
      rebuild:
        description: 'Force rebuild (no cache)'
        required: false
        default: false
        type: boolean

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # Master deployment
  # Runs on nodes with label: [self-hosted, master]
  # ============================================
  deploy-master:
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'master'
    runs-on: [self-hosted, master]
    timeout-minutes: 25

    env:
      DEPLOY_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for change detection

      - name: Detect changes
        id: changes
        run: |
          # workflow_dispatch or force rebuild: rebuild everything
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "rebuild_web=true" >> $GITHUB_OUTPUT
            echo "rebuild_public=true" >> $GITHUB_OUTPUT
            echo "rebuild_sync=true" >> $GITHUB_OUTPUT
            echo "Manual dispatch — rebuilding all services"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
            echo "rebuild_web=true" >> $GITHUB_OUTPUT
            echo "rebuild_public=true" >> $GITHUB_OUTPUT
            echo "rebuild_sync=true" >> $GITHUB_OUTPUT
            echo "No previous SHA — rebuilding all services"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" HEAD)
          echo "Changed files since last deploy:"
          echo "$CHANGED"
          echo ""

          # iris-web: server code, frontend, deps, docker, db migrations
          if echo "$CHANGED" | grep -qE '^(server/|src/|package\.json|package-lock\.json|\.npmrc|docker/|db/|extra/)'; then
            echo "rebuild_web=true" >> $GITHUB_OUTPUT
            echo "→ iris-web: rebuild needed"
          else
            echo "rebuild_web=false" >> $GITHUB_OUTPUT
            echo "→ iris-web: no changes, skipping build"
          fi

          # iris-public: Nuxt frontend
          if echo "$CHANGED" | grep -qE '^iris-public/'; then
            echo "rebuild_public=true" >> $GITHUB_OUTPUT
            echo "→ iris-public: rebuild needed"
          else
            echo "rebuild_public=false" >> $GITHUB_OUTPUT
            echo "→ iris-public: no changes, skipping build"
          fi

          # iris-sync: Go sync service
          if echo "$CHANGED" | grep -qE '^iris-sync/'; then
            echo "rebuild_sync=true" >> $GITHUB_OUTPUT
            echo "→ iris-sync: rebuild needed"
          else
            echo "rebuild_sync=false" >> $GITHUB_OUTPUT
            echo "→ iris-sync: no changes, skipping build"
          fi

      - name: Create secrets directory
        run: mkdir -p deploy/master/secrets

      - name: Write DB secrets to files
        run: |
          echo "${{ secrets.DB_ROOT_PASSWORD }}" > deploy/master/secrets/db_root_password.txt
          echo "${{ secrets.DB_PASSWORD }}" > deploy/master/secrets/db_password.txt
          chmod 600 deploy/master/secrets/*.txt

      - name: Build and deploy master services
        working-directory: deploy/master
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
          GRAFANA_OTLP_HEADERS: ${{ secrets.GRAFANA_OTLP_HEADERS }}
          IRIS_MASTER_USER: ${{ secrets.IRIS_MASTER_USER }}
          IRIS_MASTER_PASSWORD: ${{ secrets.IRIS_MASTER_PASSWORD }}
          # Probe credentials for iris-sync to authenticate with probes
          IRIS_PROBE_USER: ${{ secrets.IRIS_PROBE_USER }}
          IRIS_PROBE_PASSWORD: ${{ secrets.IRIS_PROBE_PASSWORD }}
          # Catalog auth credentials
          CATALOG_USER: ${{ secrets.CATALOG_USER }}
          CATALOG_PASSWORD: ${{ secrets.CATALOG_PASSWORD }}
          FARO_COLLECTOR_URL: ${{ secrets.FARO_COLLECTOR_URL }}
          REBUILD_WEB: ${{ steps.changes.outputs.rebuild_web }}
          REBUILD_PUBLIC: ${{ steps.changes.outputs.rebuild_public }}
          REBUILD_SYNC: ${{ steps.changes.outputs.rebuild_sync }}
        run: |
          BUILD_ARGS=""
          if [ "${{ github.event.inputs.rebuild }}" == "true" ]; then
            BUILD_ARGS="--no-cache"
          fi
          # Only rebuild services whose source files changed
          if [ "$REBUILD_WEB" == "true" ]; then
            echo "=== Building iris-web ==="
            docker compose -p iris build $BUILD_ARGS iris-web
          else
            echo "=== Skipping iris-web build (no changes) ==="
          fi
          if [ "$REBUILD_PUBLIC" == "true" ]; then
            echo "=== Building iris-public ==="
            docker compose -p iris build $BUILD_ARGS iris-public
          else
            echo "=== Skipping iris-public build (no changes) ==="
          fi
          if [ "$REBUILD_SYNC" == "true" ]; then
            echo "=== Building iris-sync ==="
            docker compose -p iris build $BUILD_ARGS iris-sync
          else
            echo "=== Skipping iris-sync build (no changes) ==="
          fi
          # Recreate ONLY services whose image or config actually changed.
          # The old blanket `--force-recreate` bounced every container on every
          # push — including iris-db (MariaDB) and iris-vm — which is the source
          # of the "short service disruption". Compose already recreates a
          # container when its built image changes, so let it decide.
          # See REBUILD.md Phase 0 / iris-report.html §1.1.
          docker compose -p iris up -d --remove-orphans
          # OTEL config is a bind-mounted file, so editing it doesn't change the
          # container's config hash. Restart just OTEL to reload the config.
          docker compose -p iris restart iris-otel || true
          sleep 5
          docker compose -p iris ps

      - name: Health check (iris-web)
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3001 > /dev/null; then
              echo "Iris web is healthy"
              exit 0
            fi
            echo "Waiting for Iris web... ($i/30)"
            sleep 2
          done
          echo "Health check failed"
          docker compose -p iris -f deploy/master/docker-compose.yml logs iris-web
          exit 1

      - name: Health check (iris-sync)
        run: |
          # Wait for iris-sync to start and perform initial sync
          sleep 15
          # Check if container is running
          if docker ps --format '{{.Names}}' | grep -q iris-sync; then
            echo "iris-sync container is running"
            # Show recent logs
            echo "=== iris-sync logs (last 30 lines) ==="
            docker logs iris-sync 2>&1 | tail -30
          else
            echo "Warning: iris-sync container not running"
            docker compose -p iris -f deploy/master/docker-compose.yml logs iris-sync
            # Don't fail deployment if sync isn't running (probes may not be up yet)
          fi

      - name: Health check (iris-public)
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3002/api/health > /dev/null; then
              echo "Iris public is healthy"
              exit 0
            fi
            echo "Waiting for Iris public... ($i/30)"
            sleep 2
          done
          echo "Warning: iris-public health check failed"
          docker compose -p iris -f deploy/master/docker-compose.yml logs iris-public 2>&1 | tail -30
          # Don't fail deployment if frontend isn't ready yet

      - name: Cleanup old iris-bgp containers (moved to probe)
        run: |
          # iris-bgp was moved from master to probe (labbmartin) due to 4GB RAM requirement
          # Clean up any leftover containers and volumes from previous deployments
          for name in iris-bgp iris-bgp-bridge; do
            if docker ps -a --format '{{.Names}}' | grep -q "^${name}$"; then
              echo "Removing leftover container: ${name}"
              docker stop "${name}" 2>/dev/null || true
              docker rm "${name}" 2>/dev/null || true
            fi
          done
          # Remove orphaned bgp volume if it exists
          docker volume rm iris-bgp-data 2>/dev/null || true
          echo "BGP cleanup complete"

      - name: Health check (iris-vm)
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:8428/health > /dev/null; then
              echo "VictoriaMetrics is healthy"
              exit 0
            fi
            echo "Waiting for VictoriaMetrics... ($i/10)"
            sleep 2
          done
          echo "Warning: VictoriaMetrics health check failed"
          docker compose -p iris -f deploy/master/docker-compose.yml logs iris-vm 2>&1 | tail -20
          # Don't fail deployment if VM isn't ready yet

      - name: Cleanup old images
        run: |
          # Old behaviour pruned only DANGLING images and never touched the
          # build cache, which is what actually fills the disk after every
          # `npm ci` + Vite build (hence the manual `docker prune` treadmill).
          # Also reclaim build cache older than 72h — keeps recent layers for
          # fast rebuilds, evicts the rest. See REBUILD.md Phase 0 / report §1.2.
          docker image prune -f
          docker builder prune -f --filter "until=72h"

  # ============================================
  # Probe deployment
  # Uses matrix to deploy to ALL probe runners
  # Add unique labels to runners: probe01, etc.
  # ============================================
  deploy-probes:
    if: >
      github.event_name == 'push' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'probes'
    strategy:
      fail-fast: false
      matrix:
        probe:
          - probe01
          - labbmartin
          - probe03-karabro
          # - debianbook  # Retired – removed from deployment
    runs-on: [self-hosted, probe, '${{ matrix.probe }}']
    timeout-minutes: 15

    env:
      DEPLOY_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for change detection

      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "Manual dispatch — rebuilding"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "No previous SHA — rebuilding"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" HEAD)

          # Probe uses the same Dockerfile as iris-web
          if echo "$CHANGED" | grep -qE '^(server/|src/|package\.json|package-lock\.json|\.npmrc|docker/|db/|extra/)'; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
            echo "→ iris-probe: rebuild needed"
          else
            echo "rebuild=false" >> $GITHUB_OUTPUT
            echo "→ iris-probe: no changes, skipping build"
          fi

      - name: Get probe identity
        id: identity
        run: |
          PROBE_HOSTNAME=$(hostname -s)
          echo "hostname=${PROBE_HOSTNAME}" >> $GITHUB_OUTPUT
          echo "Deploying probe: ${PROBE_HOSTNAME}"

      - name: Build and deploy probe
        working-directory: deploy/probe
        env:
          HOSTNAME: ${{ steps.identity.outputs.hostname }}
          IRIS_PROBE_USER: ${{ secrets.IRIS_PROBE_USER }}
          IRIS_PROBE_PASSWORD: ${{ secrets.IRIS_PROBE_PASSWORD }}
          IRIS_MASTER_IP: ${{ secrets.IRIS_MASTER_IP }}
          REBUILD: ${{ steps.changes.outputs.rebuild }}
        run: |
          BUILD_ARGS=""
          if [ "${{ github.event.inputs.rebuild }}" == "true" ]; then
            BUILD_ARGS="--no-cache"
          fi
          if [ "$REBUILD" == "true" ]; then
            echo "=== Building iris-probe ==="
            docker compose -p iris build $BUILD_ARGS iris-probe
          else
            echo "=== Skipping iris-probe build (no changes) ==="
          fi
          # Recreate only what changed (no blanket --force-recreate). The probe
          # image is rebuilt above when source changed; compose recreates it then.
          # See REBUILD.md Phase 0 / iris-report.html §1.1.
          docker compose -p iris up -d --remove-orphans
          sleep 5
          docker compose -p iris ps

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3001 > /dev/null; then
              echo "Iris probe is healthy"
              exit 0
            fi
            echo "Waiting for Iris probe... ($i/30)"
            sleep 2
          done
          echo "Health check failed"
          docker compose -p iris -f deploy/probe/docker-compose.yml logs iris-probe
          exit 1

      - name: Cleanup retired probe-side containers
        run: |
          for name in iris-log-collector iris-bgp iris-bgp-bridge; do
            if docker ps -a --format '{{.Names}}' | grep -q "^${name}$"; then
              echo "Removing retired container: ${name}"
              docker stop "${name}" 2>/dev/null || true
              docker rm "${name}" 2>/dev/null || true
            fi
          done
          docker volume rm iris-bgp-data 2>/dev/null || true

      - name: Cleanup old images
        run: |
          # Old behaviour pruned only DANGLING images and never touched the
          # build cache, which is what actually fills the disk after every
          # `npm ci` + Vite build (hence the manual `docker prune` treadmill).
          # Also reclaim build cache older than 72h — keeps recent layers for
          # fast rebuilds, evicts the rest. See REBUILD.md Phase 0 / report §1.2.
          docker image prune -f
          docker builder prune -f --filter "until=72h"
