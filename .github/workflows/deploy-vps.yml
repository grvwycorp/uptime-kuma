name: Deploy to VPS

on:
  push:
    branches:
      - feat/globalping-integration
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          # Copy repo files to deployment directory (exclude data to preserve persistence)
          sudo rsync -av --delete --exclude='data' $GITHUB_WORKSPACE/ /opt/uptime-kuma/

          # Build and restart containers
          cd /opt/uptime-kuma
          sudo docker compose down
          sudo docker compose build --no-cache
          sudo docker compose up -d

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://localhost:3001/api/status-page/heartbeat || exit 1
