name: Deploy to VPS

on:
  push:
    branches:
      - feat/Globalping-integration
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy with Docker Compose
        run: |
          # Copy repo files to deployment directory (exclude data and .env to preserve persistence/secrets)
          sudo rsync -av --delete --exclude='data' --exclude='.env' $GITHUB_WORKSPACE/ /opt/uptime-kuma/

          # Build and restart containers
          cd /opt/uptime-kuma
          sudo docker compose down
          sudo docker compose build
          sudo docker compose up -d

      - name: Verify deployment
        run: |
          sleep 10
          curl -f http://localhost:3001/api/status-page/heartbeat || exit 1
