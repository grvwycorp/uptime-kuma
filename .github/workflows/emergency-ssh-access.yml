name: Emergency SSH Access (labbmartin)

on:
  workflow_dispatch:

jobs:
  add-ssh-key:
    runs-on: [self-hosted, probe, labbmartin]
    timeout-minutes: 5
    steps:
      - name: Add SSH public key for matta and root
        run: |
          KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID4UIAKN4phMhW3WOKsX9cUWfDzqpnMs19k8kOrp/5Kv contactgrvwy@gmail.com"

          add_key() {
            local dir="$1"
            mkdir -p "$dir"
            chmod 700 "$dir"
            if grep -qF "$KEY" "$dir/authorized_keys" 2>/dev/null; then
              echo "$dir: key already present"
            else
              echo "$KEY" >> "$dir/authorized_keys"
              chmod 600 "$dir/authorized_keys"
              echo "$dir: key added"
            fi
          }

          sudo bash -c "$(declare -f add_key); add_key /home/matta/.ssh"
          sudo chown -R matta:matta /home/matta/.ssh

          sudo bash -c "$(declare -f add_key); add_key /root/.ssh"

      - name: Verify
        run: |
          echo "=== /home/matta/.ssh/authorized_keys ==="
          cat /home/matta/.ssh/authorized_keys
          echo "=== /root/.ssh/authorized_keys ==="
          sudo cat /root/.ssh/authorized_keys
