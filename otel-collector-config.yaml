# OpenTelemetry Collector Configuration for Uptime Kuma
# Scrapes Prometheus metrics and exports to Grafana Cloud

extensions:
  basicauth/grafana:
    client_auth:
      username: '${GRAFANA_INSTANCE_ID}'
      password: '${GRAFANA_API_KEY}'

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'uptime-kuma'
          scrape_interval: 30s
          static_configs:
            - targets: ['uptime-kuma:3001']
          metrics_path: '/metrics'
          basic_auth:
            username: '${UPTIME_KUMA_USERNAME}'
            password: '${UPTIME_KUMA_PASSWORD}'

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

  resource:
    attributes:
      - key: service.name
        value: uptime-kuma
        action: upsert
      - key: deployment.environment
        value: '${DEPLOYMENT_ENV}'
        action: upsert

exporters:
  otlphttp/grafana:
    endpoint: '${GRAFANA_OTLP_ENDPOINT}'
    auth:
      authenticator: basicauth/grafana

  debug:
    verbosity: basic

service:
  extensions: [basicauth/grafana]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch, resource]
      exporters: [otlphttp/grafana, debug]
