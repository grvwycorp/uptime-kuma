# OpenTelemetry Collector Configuration for Uptime Kuma
# Scrapes Prometheus metrics and exports to Grafana Cloud

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'uptime-kuma'
          scrape_interval: 30s
          static_configs:
            - targets: ['uptime-kuma:3001']
          metrics_path: '/metrics'
          basic_auth:
            # These must match your Uptime Kuma admin credentials
            username: '${UPTIME_KUMA_USERNAME}'
            password: '${UPTIME_KUMA_PASSWORD}'

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

  resource:
    attributes:
      - key: service.name
        value: uptime-kuma
        action: upsert
      - key: deployment.environment
        value: '${DEPLOYMENT_ENV:-production}'
        action: upsert

exporters:
  # Grafana Cloud OTLP endpoint
  otlphttp:
    endpoint: '${GRAFANA_OTLP_ENDPOINT}'
    headers:
      Authorization: 'Basic ${GRAFANA_OTLP_TOKEN}'

  # Debug exporter (logs metrics to console) - useful for testing
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch, resource]
      exporters: [otlphttp, debug]
