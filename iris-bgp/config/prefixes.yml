# BGPalerter prefixes.yml — Swedish Digital Infrastructure
#
# Monitors BGP routing for critical Swedish internet infrastructure.
# Uses ASN-based monitoring (auto-discovers all announced prefixes per ASN)
# plus specific prefix entries for DNS roots, IX peering LANs, and government networks.
#
# Generated: 2026-02-23
# Sources: RIPE NCC, PeeringDB, bgp.he.net, BGPView, service-discovery RECON docs

# =============================================================================
# ASN-BASED MONITORING (auto-discovers all prefixes per ASN)
# =============================================================================

options:
  monitorASns:

    # -------------------------------------------------------------------------
    # Swedish ISPs
    # -------------------------------------------------------------------------
    3301:                              # Telia Company AB — largest Swedish ISP
      group: swedish-isp
    1257:                              # Tele2 Sverige AB — #2 ISP (SWIPNET legacy, includes Com Hem / Comviq)
      group: swedish-isp
    8473:                              # Bahnhof AB — independent ISP + hosting, privacy-focused
      group: swedish-isp
    8434:                              # Telenor Sverige AB — Swedish mobile/broadband
      group: swedish-isp
    29518:                             # Bredband2 AB — #4 by Swedish eyeballs
      group: swedish-isp
    44034:                             # Hi3G Access AB — Tre (3 Sverige), 4th mobile operator
      group: swedish-isp

    # -------------------------------------------------------------------------
    # Swedish Infrastructure / Backbone
    # -------------------------------------------------------------------------
    1299:                              # Arelion (ex-Telia Carrier) — Tier 1 global backbone, Swedish-based
      group: swedish-infra
    1653:                              # SUNET (Vetenskapsradet) — Swedish University Network
      group: swedish-infra
    2603:                              # NORDUnet — Nordic research and education backbone
      group: swedish-infra
    12552:                             # GlobalConnect AB (ex-IP-Only) — major Swedish fiber/transit
      group: swedish-infra
    216025:                            # Mullvad VPN AB — Swedish privacy VPN (own AS since 2023)
      group: swedish-infra
    39351:                             # 31173 Services AB — Mullvad parent/transit company
      group: swedish-infra

    # -------------------------------------------------------------------------
    # DNS Infrastructure
    # -------------------------------------------------------------------------
    8674:                              # Netnod AB — IX operator, 6 IXP locations in Sweden
      group: dns-infra
    29216:                             # Netnod AB (I-root) — i.root-servers.net anycast
      group: dns-infra
    197564:                            # Internetstiftelsen (IIS) — .se/.nu TLD registry
      group: dns-infra

    # -------------------------------------------------------------------------
    # Swedish Hosting Providers
    # -------------------------------------------------------------------------
    42708:                             # GleSYS AB — Swedish hosting
      group: swedish-hosting
    41001:                             # Safespring AB — Swedish sovereign cloud (SUNET-affiliated)
      group: swedish-hosting
    39570:                             # Loopia AB — Swedish web hosting
      group: swedish-hosting
    35041:                             # Binero AB — Swedish hosting/cloud, Stockholm
      group: swedish-hosting

    # -------------------------------------------------------------------------
    # Swedish Government Networks
    # -------------------------------------------------------------------------
    2799:                              # Polismyndigheten — Swedish Police (147.186.0.0/16 LAWNET)
      group: swedish-gov
    39658:                             # Statistics Sweden / SCB (193.180.124.0/24)
      group: swedish-gov
    15991:                             # Skatteverket — Swedish Tax Agency (137.61.0.0/16)
      group: swedish-gov
    205916:                            # Freja eID Group AB — government-approved eID (185.202.64.0/22)
      group: swedish-gov

    # -------------------------------------------------------------------------
    # Swedish Financial Infrastructure
    # -------------------------------------------------------------------------
    59807:                             # Swedbank AB — Sweden's largest bank by customers
      group: swedish-finance
    44320:                             # SEB (Skandinaviska Enskilda Banken AB)
      group: swedish-finance
    201271:                            # Nordea Bank Abp — largest Nordic bank by assets
      group: swedish-finance
    31574:                             # Bankgirocentralen BGC AB — payment clearing (P27 platform)
      group: swedish-finance


# =============================================================================
# SPECIFIC PREFIX MONITORING
# For critical infrastructure where exact prefix + origin AS is known.
# Catches hijacks, route leaks, and origin violations.
# =============================================================================

# -----------------------------------------------------------------------------
# Netnod IX Peering LANs
#
# These prefixes should NEVER appear in the global BGP routing table.
# Any announcement is a route leak. Netnod operates Green/Blue dual-fabric
# architecture at larger sites.
# -----------------------------------------------------------------------------

194.68.123.0/24:
  description: Netnod IX Stockholm GREEN peering LAN
  asn: [8674]
  ignoreMorespecifics: false
  group: dns-infra

194.68.128.0/24:
  description: Netnod IX Stockholm BLUE peering LAN
  asn: [8674]
  ignoreMorespecifics: false
  group: dns-infra

194.68.130.0/24:
  description: Netnod IX Gothenburg peering LAN
  asn: [8674]
  ignoreMorespecifics: false
  group: dns-infra

212.237.193.0/24:
  description: Netnod IX Copenhagen/Malmo GREEN peering LAN (cross-border DK/SE)
  asn: [8674]
  ignoreMorespecifics: false
  group: dns-infra

212.237.192.0/24:
  description: Netnod IX Copenhagen/Malmo BLUE peering LAN (cross-border DK/SE)
  asn: [8674]
  ignoreMorespecifics: false
  group: dns-infra

194.68.133.0/24:
  description: Netnod IX Sundsvall peering LAN
  asn: [8674]
  ignoreMorespecifics: false
  group: dns-infra

194.68.131.64/26:
  description: Netnod IX Lulea peering LAN (note /26 not /24)
