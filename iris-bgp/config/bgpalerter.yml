connectors:
  - file: connectorRIS
    name: ris
    params:
      carefulSubscription: true
      url: ws://ris-live.ripe.net/v1/ws/
      perMessageDeflate: true
      subscription:
        moreSpecific: true
        type: UPDATE
        socketOptions:
          includeRaw: false

monitors:
  - file: monitorHijack
    channel: hijack
    name: basic-hijack-detection
    params:
      thresholdMinPeers: 3

  - file: monitorNewPrefix
    channel: newprefix
    name: prefix-detection
    params:
      thresholdMinPeers: 3

  - file: monitorPath
    channel: path
    name: path-matching
    params:
      thresholdMinPeers: 1

  - file: monitorVisibility
    channel: visibility
    name: withdrawal-detection
    params:
      thresholdMinPeers: 40
      notificationIntervalSeconds: 3600

  - file: monitorAS
    channel: misconfiguration
    name: asn-monitor
    params:
      skipPrefixMatch: false
      thresholdMinPeers: 3

  - file: monitorRPKI
    channel: rpki
    name: rpki-monitor
    params:
      thresholdMinPeers: 3
      checkUncovered: false
      checkDisappearing: false

  - file: monitorROAS
    channel: roa
    name: rpki-diff
    params:
      enableDiffAlerts: true
      enableExpirationAlerts: true
      enableExpirationCheckTA: true
      enableDeletedCheckTA: true
      roaExpirationAlertHours: 2
      checkOnlyASns: true

  - file: monitorPathNeighbors
    channel: path
    name: path-neighbors
    params:
      thresholdMinPeers: 3

reports:
  # Webhook to iris-bgp-bridge for OTEL metric conversion
  - file: reportHTTP
    channels:
      - hijack
      - newprefix
      - visibility
      - path
      - misconfiguration
      - rpki
      - roa
    params:
      method: post
      isTemplateJSON: true
      showPaths: 5
      templates:
        default: '{"channel": "${channel}", "summary": "${summary}", "data": {"type": "${type}", "prefix": "${prefix}", "asn": "${asn}", "newprefix": "${newprefix}", "neworigin": "${neworigin}", "description": "${description}", "peers": "${peers}", "earliest": "${earliest}", "latest": "${latest}"}}'
      headers: {}
      hooks:
        default: http://localhost:8080/alert

  # Pull API for health checks and debugging
  - file: reportPullAPI
    channels:
      - hijack
      - newprefix
      - visibility
      - path
      - misconfiguration
      - rpki
      - roa
    params:
      maxAlertsAmount: 100

  # File reporter for local alert history
  - file: reportFile
    channels:
      - hijack
      - newprefix
      - visibility
      - path
      - misconfiguration
      - rpki
      - roa
    params:
      persistAlertData: false
      alertDataDirectory: alertdata/

notificationIntervalSeconds: 86400
persistStatus: true

rest:
  host: 0.0.0.0
  port: 8011

logging:
  directory: logs
  logRotatePattern: YYYY-MM-DD
  maxRetainedFiles: 10
  maxFileSizeMB: 15
  compressOnRotation: false
  useUTC: true

checkForUpdatesAtBoot: false
generatePrefixListEveryDays: 7

monitoredPrefixesFiles:
  - prefixes.yml

rpki:
  vrpProvider: ntt
  refreshVrpListMinutes: 15
  markDataAsStaleAfterMinutes: 120

alertOnlyOnce: false
fadeOffSeconds: 360
checkFadeOffGroupsSeconds: 30
maxMessagesPerSecond: 6000
multiProcess: false
environment: production
configVersion: 2
